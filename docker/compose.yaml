# En la Raspberry Pi:  docker compose -f docker/compose.yaml up -d
# Imagen ya construida (releases):  docker compose -f docker/compose.yaml pull
# Una versión concreta: export RASPTANK_VERSION=v0.1.0 (para pull y up)
services:
  rasptank:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/gbellido-dev/rasptank2:${RASPTANK_VERSION:-latest}
    container_name: rasptank
    restart: unless-stopped
    network_mode: host          # DDS necesita la red del anfitrión
    ipc: host
    privileged: true            # I2C (PCA9685, ADS7830) y GPIO (ultrasonido, línea)
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-10}
    volumes:
      - /dev:/dev
      - /sys:/sys
      - calibracion:/root/.rasptank     # calibración de la odometría: sobrevive a reinicios

volumes:
  calibracion:
