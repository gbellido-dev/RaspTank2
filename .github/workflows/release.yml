name: Release

# git tag v0.1.0 && git push origin v0.1.0
#   -> Raspberry Pi image (ghcr.io), Windows package without internet, GitHub release.
# Run by hand (workflow_dispatch) it builds and tests everything without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  PIXI_PACK_VERSION: v0.7.11

jobs:
  pi-image:
    # Native arm64 runner: the Pi 4 image builds in minutes instead of hours with QEMU
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$name:sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$name:$GITHUB_REF_NAME,$name:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          push: ${{ github.ref_type == 'tag' }}
          load: ${{ github.ref_type != 'tag' }}

      - name: Comprobar la imagen
        run: |
          image="${{ steps.image.outputs.tags }}"
          docker run --rm "${image%%,*}" bash -c \
            'source /ws/install/setup.bash && ros2 pkg executables rasptank_hw'

  windows-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar el entorno de ROS 2 para Windows
        run: |
          base=https://github.com/Quantco/pixi-pack/releases/download/$PIXI_PACK_VERSION
          curl -fsSL -o pixi-pack "$base/pixi-pack-x86_64-unknown-linux-musl"
          chmod +x pixi-pack
          mkdir -p paquete/windows
          ./pixi-pack tools/windows/pixi.toml --platform win-64 \
            --output-file paquete/windows/environment.tar
          curl -fsSL -o paquete/windows/pixi-unpack.exe \
            "$base/pixi-unpack-x86_64-pc-windows-msvc.exe"

      - name: Crear el zip
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name="RaspTank2-$version-windows"
          # git archive applies .gitattributes: .bat and .cmd files get CRLF
          git archive --format=tar --prefix="$name/" HEAD | tar -x -C paquete
          mv paquete/windows "paquete/$name/windows"
          (cd paquete && zip -q -r -0 "../$name.zip" "$name")
          ls -lh "$name.zip"
          echo "ZIP=$name.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ env.ZIP }}
          compression-level: 0
          retention-days: 7

  windows-test:
    # Installs the package as a classroom PC would: no pixi, no downloads
    needs: windows-package
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Descomprimir
        shell: pwsh
        run: |
          $zip = Get-ChildItem *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath C:\rt
          $dir = Get-ChildItem C:\rt | Select-Object -First 1
          "RT_DIR=$($dir.FullName)" >> $env:GITHUB_ENV

      - name: Instalar sin internet
        run: |
          cd /d "%RT_DIR%"
          call scripts\instalar_windows.bat

      - name: Tests
        timeout-minutes: 15
        run: |
          cd /d "%RT_DIR%"
          call scripts\tests_windows.bat --e2e

  publish:
    if: github.ref_type == 'tag'
    needs: [pi-image, windows-package, windows-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -e "s|{{VERSION}}|$GITHUB_REF_NAME|g" \
              -e "s|{{IMAGE}}|ghcr.io/${GITHUB_REPOSITORY,,}|g" \
              .github/release_notes.md > notas.md
          # The release may already exist if it was created on github.com (that creates the tag)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" RaspTank2-*-windows.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --title "RaspTank2 $GITHUB_REF_NAME" --notes-file notas.md
          else
            gh release create "$GITHUB_REF_NAME" RaspTank2-*-windows.zip \
              --title "RaspTank2 $GITHUB_REF_NAME" --notes-file notas.md --generate-notes
          fi
